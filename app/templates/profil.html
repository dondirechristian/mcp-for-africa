{% extends "base.html" %}
{% from "_macros.html" import options_pays %}
{% block titre %}Mon profil — MCP for Africa{% endblock %}
{% block contenu %}
<div class="formulaire" style="max-width:560px">
  <h1>Mon profil</h1>
  <form method="post" action="/profil">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="champ"><label for="pays">Pays</label><select id="pays" name="pays">{{ options_pays(d.pays, "Choisir…") }}</select></div>
    <div class="champ"><label for="github">Compte GitHub</label><input id="github" name="github" value="{{ d.github }}"></div>
    <div class="champ"><label for="bio">Présentation</label><textarea id="bio" name="bio" maxlength="1000" placeholder="Ce sur quoi vous travaillez, les services que vous connaissez bien">{{ d.bio }}</textarea></div>
    <button class="btn" type="submit">Enregistrer</button>
  </form>
</div>
{% endblock %}
